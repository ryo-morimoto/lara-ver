name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows conventional commits
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const validPrefixes = ['feat:', 'fix:', 'docs:', 'chore:', 'refactor:', 'test:', 'ci:', 'perf:', 'style:'];
            
            const isValid = validPrefixes.some(prefix => title.startsWith(prefix));
            
            if (!isValid) {
              core.setFailed(`PR title must start with one of: ${validPrefixes.join(', ')}`);
              
              // Post helpful comment
              const comment = '## ⚠️ PR Title Format Required\n' +
              '\n' +
              'Your PR title needs to follow the Conventional Commits format:\n' +
              '\n' +
              '- `feat:` - New features (→ minor version bump)\n' +
              '- `fix:` - Bug fixes (→ patch version bump)\n' +
              '- `docs:` - Documentation only changes\n' +
              '- `chore:` - Maintenance tasks\n' +
              '- `refactor:` - Code refactoring\n' +
              '- `test:` - Adding or fixing tests\n' +
              '- `ci:` - CI/CD changes\n' +
              '- `perf:` - Performance improvements\n' +
              '- `style:` - Code style changes\n' +
              '\n' +
              '**Example:** `feat: add support for Laravel 12`\n' +
              '\n' +
              'Please update your PR title to proceed.';
              
              // Check if we already commented
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              
              const botComment = comments.data.find(comment => 
                comment.user.type === 'Bot' && 
                comment.body.includes('PR Title Format Required')
              );
              
              if (!botComment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment
                });
              }
            } else {
              console.log(`✅ PR title is valid: ${title}`);
            }